name: Test markdownlint flags disabling all rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write config disabling all rules
        run: |
          echo '{ "default": false }' > "$GITHUB_WORKSPACE/tests/fixtures/bad/.markdownlint-off.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          markdownlint_flags: --config tests/fixtures/bad/.markdownlint-off.json tests/fixtures/bad/bad.md
      - name: Assert action succeeded when all rules disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when all rules are disabled via config"
            exit 1
          fi
          echo "PASS"
