name: Test markdownlint with errors - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run markdownlint with fail_level=none (should not fail even with errors)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          markdownlint_flags: 'tests/fixtures/invalid-md'

      - name: Assert action completed without failing
        run: |
          echo "PASS: action completed with fail_level=none despite lint errors"
