name: Test markdownlint with lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: ./_testdata
      - name: Assert action completed (errors found but fail_level=none)
        run: |
          echo "Action completed with fail_level=none even when lint errors exist"
          echo "PASS"
