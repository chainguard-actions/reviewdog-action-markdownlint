name: Test basic usage - valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdownlint on valid markdown file
        id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: >-
            ${{ github.workspace }}/pristine/reviewdog--action-markdownlint/v0.27.0/tests/fixtures/valid.md
      - name: Assert action succeeded
        run: |
          echo "PASS: markdownlint ran successfully on valid markdown"
