name: Test basic usage - valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run markdownlint on valid markdown
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: 'tests/fixtures/valid-md'

      - name: Assert action completed successfully
        run: |
          echo "PASS: markdownlint ran successfully on valid markdown"
