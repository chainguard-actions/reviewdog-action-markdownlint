name: Test basic usage - clean markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean markdown file for linting
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/good.md" << 'EOF'
          # Good Markdown

          This is a well-formatted markdown file.

          ## Section One

          Some content here.

          ## Section Two

          More content here.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: tests/fixtures/clean/good.md

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: markdownlint ran successfully on clean markdown"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for github-check)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
