name: Test basic usage - valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          markdownlint_flags: 'tests/fixtures/valid.md'
      - name: Assert action succeeded
        run: |
          echo "Action completed successfully"
          echo "PASS: markdownlint ran without failure on valid markdown"
