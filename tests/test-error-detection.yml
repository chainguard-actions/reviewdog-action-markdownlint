name: Test error detection - invalid markdown with fail_on_error false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          markdownlint_flags: 'tests/fixtures/invalid.md'
      - name: Assert action did not fail (fail_on_error is false)
        run: |
          echo "Action completed - fail_on_error=false so action should succeed even with lint errors"
          echo "PASS: action exited successfully with fail_on_error=false"
