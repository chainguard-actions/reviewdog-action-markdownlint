name: Test error detection - bad markdown with fail_level error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with linting errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-bad-dir"
          printf '# Bad Markdown\n\n\n  ## ## Badly Nested\n  * item one\n  * item two\n  1. mixed\n' \
            > "$GITHUB_WORKSPACE/test-bad-dir/bad.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: 'test-bad-dir/bad.md'

      - name: Assert action ran (either found errors or failed on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (either markdownlint found errors or sentinel repo rejected reviewdog)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog reported findings without failing)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
