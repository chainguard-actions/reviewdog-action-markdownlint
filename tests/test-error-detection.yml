name: Test error detection - invalid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create invalid markdown file with linting issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/invalid"
          # Create a markdown file with known markdownlint violations:
          # MD041: first line should be a top-level heading
          # MD022: headings should be surrounded by blank lines
          # MD032: lists should be surrounded by blank lines
          printf 'This is not a heading\n## Missing blank line\n- item1\n- item2\nno blank line after list\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/invalid/bad.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: any
          markdownlint_flags: 'tests/fixtures/invalid'

      - name: Assert action detected markdown issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: markdownlint correctly detected issues in invalid markdown"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: markdownlint ran (may have found issues but fail_level not triggered)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
