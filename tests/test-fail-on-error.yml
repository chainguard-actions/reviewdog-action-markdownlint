name: Test fail_on_error - action fails when lint errors found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'true'
          markdownlint_flags: 'tests/fixtures/invalid.md'
      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_on_error=true and invalid markdown, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when lint errors found and fail_on_error=true"
