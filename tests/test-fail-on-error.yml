name: Test deprecated fail_on_error input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'true'
          level: error
          markdownlint_flags: tests/fixtures/bad.md
      - name: Assert action ran with deprecated fail_on_error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In this action version the default fail_level=none takes precedence
          # over the deprecated -fail-on-error flag (reviewdog only emits a
          # deprecation warning), so the run completes successfully.
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (fail_level=none overrides deprecated fail_on_error)"
            exit 1
          fi
          echo "PASS"
