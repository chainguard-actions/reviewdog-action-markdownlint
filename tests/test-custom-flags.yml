name: Test custom markdownlint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint with custom flags targeting specific file
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: warning
          markdownlint_flags: 'tests/fixtures/custom/good.md'

      - name: Assert action completed with custom flags
        run: |
          echo "PASS: markdownlint ran successfully with custom flags targeting specific file"
