name: Test custom markdownlint_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean markdown files in a target directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-flags"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-flags/readme.md" << 'EOF'
          # Project Readme

          This is a clean markdown file.

          ## Installation

          Run the following command:

          ```sh
          npm install
          ```

          ## Usage

          See the documentation for details.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: tests/fixtures/custom-flags/readme.md

      - name: Assert action ran with custom flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with custom markdownlint_flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for github-check reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
