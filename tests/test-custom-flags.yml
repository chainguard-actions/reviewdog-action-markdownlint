name: Test custom markdownlint_flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write markdown files and a custom config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-custom"
          printf '# Documentation\n\nThis document is well-formatted.\n\n## Overview\n\nEverything looks good here.\n' \
            > "$GITHUB_WORKSPACE/md-custom/doc.md"
          printf '{"default": false}\n' \
            > "$GITHUB_WORKSPACE/md-custom/.markdownlint.json"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: '--config md-custom/.markdownlint.json md-custom/doc.md'

      - name: Assert action succeeded with custom flags
        run: |
          echo "Action completed successfully with custom markdownlint flags"
          echo "PASS"
