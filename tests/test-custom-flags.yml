name: Test custom markdownlint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown files in a specific directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-custom-dir"
          cat > "$GITHUB_WORKSPACE/test-custom-dir/readme.md" << 'EOF'
          # Custom Directory Test

          This file is in a custom directory.

          ## Overview

          Testing that markdownlint_flags correctly targets this directory.

          - Point one
          - Point two
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: 'test-custom-dir'

      - name: Assert action ran with custom flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom markdownlint_flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable by reviewdog)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
