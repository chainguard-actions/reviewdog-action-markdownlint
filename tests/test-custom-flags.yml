name: Test custom markdownlint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdownlint with custom flags and warning level
        id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none
          markdownlint_flags: >-
            --disable MD013 -- ${{ github.workspace }}/pristine/reviewdog--action-markdownlint/v0.27.0/tests/fixtures/valid.md
      - name: Assert action succeeded with custom flags
        run: |
          echo "PASS: markdownlint ran successfully with custom flags (MD013 disabled, warning level)"
