name: Test fail_on_error false with lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-errors"
          # Create a file with multiple H1 headings (MD025) and trailing spaces (MD009)
          printf '# Heading One\n\n# Another H1\n\nSome text with trailing spaces   \n' > "$GITHUB_WORKSPACE/md-errors/bad.md"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: error
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          markdownlint_flags: 'md-errors'

      - name: Assert action did not fail despite lint errors
        run: |
          echo "Action completed without failing even with lint errors (fail_on_error=false)"
          echo "PASS"
