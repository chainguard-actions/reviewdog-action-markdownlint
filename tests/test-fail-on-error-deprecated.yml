name: Test deprecated fail_on_error input is accepted (fail_level none takes precedence)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The deprecated fail_on_error input is still passed through to reviewdog
      # (which logs a deprecation warning), but the explicit fail_level
      # (default 'none') takes precedence, so the step must still succeed
      # even though bad.md has lint errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'true'
          fail_level: none
          markdownlint_flags: tests/fixtures/bad/bad.md
      - name: Assert action ran successfully with deprecated input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (fail_level=none overrides deprecated fail_on_error)"
            exit 1
          fi
          echo "PASS"
