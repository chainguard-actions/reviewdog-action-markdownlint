name: Test deprecated fail_on_error is accepted (fail_level none takes precedence)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The deprecated fail_on_error input is still passed to reviewdog, which only
      # logs a deprecation warning. With fail_level=none (the default) given
      # explicitly, reviewdog exits 0 even when it finds lint errors. The action
      # must accept the deprecated input without crashing.
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: none
          fail_on_error: 'true'
          markdownlint_flags: tests/fixtures/bad.md
      - name: Assert action ran successfully with deprecated input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (fail_level=none overrides deprecated fail_on_error)"
            exit 1
          fi
          echo "PASS"
