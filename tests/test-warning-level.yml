name: Test markdownlint with warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: dummy-token
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: 'pristine/reviewdog--action-markdownlint/v0.26.2/tests/fixtures'
      - name: Assert action completed with warning level
        run: |
          echo "markdownlint ran successfully with warning level"
          echo "PASS"
