name: Test lint errors detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
          level: error
          markdownlint_flags: 'action/_testdata/test.md'

      - name: Assert action detected lint errors or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The test.md file has known lint issues (indented headings, mixed list styles).
          # With fail_level: error, reviewdog should exit non-zero when issues are found.
          # Under the sentinel repo, the github-check reporter may also fail with 404.
          # Either way, the action should NOT succeed silently.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly reported failure (lint errors found or sentinel repo API failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have reported issues without failing)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
