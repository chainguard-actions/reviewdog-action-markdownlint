name: Test markdownlint with lint errors - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/errors"
          # This file has intentional markdownlint violations:
          # - MD022: Headings should be surrounded by blank lines
          # - MD041: First line should be a top-level heading (missing)
          # - MD009: Trailing spaces
          printf '## Missing top-level heading\n### Sub without parent\n* item1\n* item2\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/errors/bad.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: tests/fixtures/errors/bad.md

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level: none, reviewdog always exits 0 regardless of lint findings.
          # The action may still fail if the sentinel repo causes github-check API calls to fail.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with fail_level=none (lint errors do not cause failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for github-check reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
