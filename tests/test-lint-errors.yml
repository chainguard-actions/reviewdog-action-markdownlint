name: Test markdownlint with lint errors - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run markdownlint on file with errors (fail_level none)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: error
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: 'tests/fixtures/errors'

      - name: Assert action completed without failure (fail_level=none)
        run: |
          echo "PASS: markdownlint ran with lint errors but did not fail because fail_level=none"
