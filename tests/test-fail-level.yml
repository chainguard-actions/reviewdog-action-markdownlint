name: Test fail_level - markdown with errors causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write a markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-bad"
          printf '# Bad Markdown\n\n\n\nExtra blank lines above.\n\n#Missing space after hash.\n' \
            > "$GITHUB_WORKSPACE/md-bad/invalid.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          markdownlint_flags: 'md-bad/invalid.md'

      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when markdown has errors and fail_level=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog reported issues without failing the step)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
