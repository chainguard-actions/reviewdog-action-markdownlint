name: Test markdownlint fail_level behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a markdown file with linting errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/md-errors"
          # Create a file with multiple markdownlint violations:
          # - Missing blank line after heading (MD022)
          # - Trailing spaces
          # - Multiple blank lines (MD012)
          printf '# Heading\nNo blank line after heading\n\n\n\nMultiple blank lines above\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/md-errors/bad.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: 'tests/fixtures/md-errors'

      - name: Assert action ran (failure expected due to lint errors or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and markdown errors present, action should fail.
          # It may also fail due to the sentinel GITHUB_REPOSITORY.
          # Either way, failure is the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (lint errors detected or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog reported but did not fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
