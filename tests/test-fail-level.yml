name: Test markdownlint - fail_level error causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-fail"
          # Create a markdown file with known violations to trigger fail_level
          printf 'This is not a heading\n## Missing blank lines\nsome content\n' \
            > "$GITHUB_WORKSPACE/md-fail/invalid.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: 'md-fail/'

      - name: Assert action failed or ran (errors found with fail_level=error, or API failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and lint errors present, reviewdog exits 1 → action fails.
          # With the sentinel repo, the GitHub API call may also fail.
          # Either way, failure is the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (lint errors found with fail_level=error, or sentinel repo API failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have reported no errors at error level)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
