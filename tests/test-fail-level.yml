name: Test fail_level causes non-zero exit on lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level"
          # Intentional violations: MD041 (no top-level heading), MD022 (no blank lines around headings)
          printf '## Not a top-level heading\nsome text\n## Another heading\nmore text\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/bad.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: error
          markdownlint_flags: tests/fixtures/fail-level/bad.md

      - name: Assert action failed due to lint errors or sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level: error and lint errors present, reviewdog exits 1 → action fails.
          # The sentinel repo also causes github-check API calls to fail.
          # Either way, the action should NOT succeed here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (lint errors with fail_level=error, or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to lint errors with fail_level=error"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
