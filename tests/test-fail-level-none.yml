name: Test fail_level none - always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create markdown file with linting issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level"
          # Create a markdown file with violations
          printf 'no heading here\n## bad structure\n- list item\nno blank line\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/bad.md"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          markdownlint_flags: 'tests/fixtures/fail-level'

      - name: Assert action succeeded despite markdown issues (fail_level=none)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 as expected with fail_level=none"
          else
            echo "FAIL: expected success with fail_level=none but got '$OUTCOME'"
            exit 1
          fi
